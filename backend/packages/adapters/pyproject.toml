[project]
name = "edp-adapters"
version = "0.1.0"
description = "EDP 上游适配器包（W1 仅骨架，实现见 W2 EDP-010）"
requires-python = ">=3.12"
dependencies = [
    "edp-api",
]

[tool.uv.sources]
edp-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edp_adapters"]

# EDP staging pgbackrest 最小配置（T14 / EDP-021）
# 仓库形态：本地命名卷（edp_staging_backups → 容器 /pgbackrest）。
# 拷贝模式：备份在 patroni 容器内本地执行（数据目录与 repo 同容器可达），
#   docker compose exec patroni1 pgbackrest --stanza=edp stanza-create   # 首次建 stanza（幂等）
#   docker compose exec patroni1 pgbackrest --stanza=edp backup          # 首次全量备份
#   docker compose exec pgbackrest pgbackrest info                       # 查看 repo 备份集
# pgbackrest 服务容器仅持有 repo 卷 + 本配置（repo keeper / info 查询入口）。

[global]
repo1-path=/pgbackrest/repo
repo1-retention-full=2
process-max=2
log-level-console=info
log-level-file=off

# WAL 归档：已启用（patroni*.yml postgresql.parameters.archive_mode/archive_command），
# archive-push 同步写入本 repo 卷；量级增大后可打开 archive-async=y。
# archive-async=y

[edp]
# 本地模式：备份经 docker compose exec patroni1 执行，pg1 即本机（数据目录/套接字）
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-user=postgres
